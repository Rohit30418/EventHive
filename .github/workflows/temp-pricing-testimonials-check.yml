name: Temporary pricing and testimonial design check
on:
  push:
    branches: [ui/homepage-orange-motion-refine-20261102]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: AIzaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: eventhive-visual-check
      VITE_FIREBASE_STORAGE_BUCKET: eventhive-visual-check.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef1234
      VITE_FIREBASE_DATABASE_URL: https://eventhive-test-default-rtdb.firebaseio.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Unit tests
        if: always()
        run: npm test
      - name: Install browser checker
        if: always()
        run: npm install --no-save --package-lock=false playwright
      - name: Pricing and moving testimonial browser checks
        if: always()
        run: |
          set -e
          mkdir -p /tmp/eh-review
          npm run dev -- --host 127.0.0.1 > /tmp/eh-review-dev.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({channel:"chrome",headless:true,args:["--no-sandbox"]});
          const fake = {id:"event-1",EventName:"Community Event",eventDate:"2027-05-01",location:"Delhi, India",eventType:"Community"};
          let failures=0;
          for(const width of [375,768,1024,1440]){
            const ctx=await browser.newContext({viewport:{width,height:900},reducedMotion:"no-preference"});
            const page=await ctx.newPage();
            await page.route("**/Events/*.json",r=>r.fulfill({status:200,contentType:"application/json",body:JSON.stringify(fake)}));
            await page.route("**/Events.json",r=>r.fulfill({status:200,contentType:"application/json",body:JSON.stringify({"event-1":fake})}));
            await page.goto("http://127.0.0.1:5173/",{waitUntil:"domcontentloaded",timeout:30000});
            await page.locator("#testimonials .eh-extras-story-card").first().waitFor({timeout:20000});
            await page.waitForTimeout(900);
            const m=await page.evaluate(()=>{
              const grid=document.querySelector(".eh-extras-pricing-grid");
              const popular=document.querySelectorAll(".eh-extras-price-card.is-popular");
              const card=popular[0];
              const stories=[...document.querySelectorAll(".eh-extras-story-group:first-child .eh-extras-story-card")];
              const photos=[...document.querySelectorAll(".eh-extras-story-group:first-child img")];
              const rect=e=>e?.getBoundingClientRect();
              const plans=[...document.querySelectorAll(".eh-extras-price-card")].map(rect);
              return {
                width:innerWidth,overflow:document.documentElement.scrollWidth-innerWidth,
                popular:popular.length,popularName:card?.querySelector("h3")?.textContent,
                badge:card?.querySelector(".eh-extras-popular-badge")?.textContent?.trim(),
                badgeVisible:card?.querySelector(".eh-extras-popular-badge")?getComputedStyle(card.querySelector(".eh-extras-popular-badge")).display!=="none":false,
                priceCards:plans.length,priceHeights:plans.map(x=>Math.round(x.height)),
                priceColumns:getComputedStyle(grid).gridTemplateColumns.split(" ").length,
                testimonialCards:stories.length,
                visualTypes:stories.map(x=>x.className),
                portraitCount:photos.length,portraitAlts:photos.map(x=>x.alt),
                loadedPortraits:photos.filter(x=>x.complete&&x.naturalWidth>0).length,
                animation:getComputedStyle(document.querySelector(".eh-extras-story-track")).animationName,
                queryForm:!!document.querySelector("#contact form"),
                oldHero:!!document.querySelector(".eh-hero-preview"),
                originalFeatures:document.querySelectorAll(".eh-feature-card").length,
              };
            });
            const errors=[];
            if(m.overflow>2)errors.push("overflow");
            if(m.popular!==1||!m.popularName?.includes("Organizers")||!m.badge?.includes("Most Popular")||!m.badgeVisible)errors.push("featured price card");
            if(m.priceCards!==3)errors.push("pricing cards missing");
            if(width===1440 && (m.priceColumns!==3 || Math.max(...m.priceHeights)-Math.min(...m.priceHeights)>4))errors.push("equal desktop pricing");
            if(m.testimonialCards!==3||m.portraitCount!==3||m.visualTypes.some(x=>!x.includes("--")))errors.push("mixed portrait cards");
            if(m.animation==="none")errors.push("moving carousel");
            if(!m.queryForm||!m.oldHero||m.originalFeatures!==6)errors.push("original homepage broken");
            if(m.portraitAlts.some(x=>!x.includes("Temporary portrait")))errors.push("placeholders unlabeled");
            console.log((errors.length?"FAIL":"PASS")+" layout="+width+" issues="+errors.join(",")+" "+JSON.stringify(m));
            failures+=errors.length;
            const toggle=page.getByRole("button",{name:"Pause moving community cards"});
            await toggle.click();
            const paused=await page.locator(".eh-extras-story-viewport").evaluate(x=>x.classList.contains("is-paused"));
            if(!paused){failures++;console.error("FAIL pause="+width);}
            else console.log("PASS pause="+width);
            await page.getByRole("button",{name:"Play moving community cards"}).click();
            await page.locator("#pricing").screenshot({path:"/tmp/eh-review/pricing-"+width+".png",animations:"disabled"});
            await page.locator("#testimonials").screenshot({path:"/tmp/eh-review/testimonials-"+width+".png",animations:"disabled"});
            await ctx.close();
          }
          await browser.close();
          console.log("DESIGN_CHECK_FAILURES="+failures);
          if(failures)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricing-testimonials-screenshots
          path: /tmp/eh-review/
          if-no-files-found: ignore

name: Temporary Original Homepage + New Sections Check
on:
  push:
    branches: [ui/homepage-orange-motion-refine-20261102]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: AIzaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: eventhive-home-query-test
      VITE_FIREBASE_STORAGE_BUCKET: eventhive-home-query-test.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef1234
      VITE_FIREBASE_DATABASE_URL: https://eventhive-test-default-rtdb.firebaseio.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Unit tests
        if: always()
        run: npm test
      - name: Install temporary Playwright
        if: always()
        run: npm install --no-save --package-lock=false playwright
      - name: Screenshot and interaction tests
        if: always()
        run: |
          set -e
          mkdir -p /tmp/eh-home-restored
          npm run dev -- --host 127.0.0.1 > /tmp/eh-home-restored.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
          let failures=0;
          const fake={id:"event-1",EventName:"Community Events",eventDate:"2027-05-01",eventType:"Community",location:"Delhi, India",banner:""};
          for (const width of [375,768,1024,1440]){
            const ctx=await browser.newContext({viewport:{width,height:900},reducedMotion:'no-preference'});
            const page=await ctx.newPage();
            await page.route('**/Events/*.json',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(fake)}));
            await page.route('**/Events.json',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({"event-1":fake})}));
            await page.goto('http://127.0.0.1:5173/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#pricing').waitFor({timeout:15000});
            await page.waitForTimeout(350);
            const m=await page.evaluate(()=>{
              const rect=s=>document.querySelector(s)?.getBoundingClientRect();
              const cards=[...document.querySelectorAll('.eh-extras-price-card')].map(x=>x.getBoundingClientRect());
              const topNav=document.querySelector('nav[aria-label="Primary navigation"]');
              const navEls=topNav?[...topNav.children].map(x=>({left:x.getBoundingClientRect().left,right:x.getBoundingClientRect().right,display:getComputedStyle(x).display})):[];
              const motion=document.querySelector('.eh-extras-story-track');
              return {width:innerWidth,scrollWidth:document.documentElement.scrollWidth,
                oldHero:document.querySelector('.eh-hero-preview')!==null,
                oldFeatures:document.querySelectorAll('.eh-feature-card').length,
                pricing:cards.length,pricingHeight:cards.map(x=>Math.round(x.height)),
                testimonies:document.querySelectorAll('.eh-extras-story-card').length,
                moving:getComputedStyle(motion).animationName,
                queryFields:document.querySelectorAll('#contact input,#contact textarea,#contact select').length,
                contact:!!rect('#contact'),nav:navEls,
                faq:document.querySelectorAll('.eh-faq-item').length};
            });
            const errors=[];
            if(m.scrollWidth>width+2)errors.push('horizontal overflow');
            if(!m.oldHero||m.oldFeatures!==6||m.faq!==4)errors.push('original homepage incomplete');
            if(m.pricing!==3||m.testimonies!==6||m.queryFields!==4)errors.push('new sections incomplete');
            if(m.moving==='none')errors.push('testimonial motion not active');
            if(width===1440 && Math.max(...m.pricingHeight)-Math.min(...m.pricingHeight)>3)errors.push('pricing heights mismatch');
            if(width>=1024){
              const visible=m.nav.filter(x=>x.display!=='none');
              if(visible.length<3||visible[0].right>visible[1].left+2||visible[1].right>visible[2].left+2)errors.push('header overlap');
            }
            console.log((errors.length?'FAIL':'PASS')+' HOME width='+width+' '+errors.join(',')+' '+JSON.stringify(m));
            failures+=errors.length;
            await page.screenshot({path:'/tmp/eh-home-restored/home-'+width+'.png',fullPage:true,animations:'disabled'});
            if(width===1440){
              for(const [sel,name] of [['.eh-home-hero','hero'],['#pricing','pricing'],['#testimonials','testimonials'],['#contact','contact']]){
                await page.locator(sel).screenshot({path:'/tmp/eh-home-restored/'+name+'.png',animations:'disabled'});
              }
            }
            const pause=page.getByRole('button',{name:'Pause moving community cards'});
            await pause.click();
            const paused=await page.locator('.eh-extras-story-viewport').evaluate(x=>x.classList.contains('is-paused'));
            if(!paused){failures++;console.log('FAIL pause at '+width)}else console.log('PASS pause at '+width);
            await page.getByRole('button',{name:'Play moving community cards'}).click();
            await page.locator('#contact input[name="name"]').fill('Test User');
            await page.locator('#contact input[name="email"]').fill('test@example.com');
            await page.locator('#contact select[name="topic"]').selectOption('Pricing');
            await page.locator('#contact textarea[name="message"]').fill('Please tell me about pricing.');
            await page.getByRole('button',{name:'Compose email'}).click();
            const prepared=await page.getByText('Your email draft is ready.',{exact:false}).isVisible().catch(()=>false);
            if(!prepared){failures++;console.log('FAIL enquiry at '+width)}else console.log('PASS enquiry at '+width);
            await ctx.close();
          }
          const ctx=await browser.newContext({viewport:{width:375,height:850},reducedMotion:'reduce'});
          const page=await ctx.newPage();
          await page.goto('http://127.0.0.1:5173/',{waitUntil:'domcontentloaded'});
          await page.locator('.eh-extras-story-track').waitFor();
          const reduced=await page.locator('.eh-extras-story-track').evaluate(x=>getComputedStyle(x).animationName);
          if(reduced!=='none'){failures++;console.log('FAIL reduced motion '+reduced)}else console.log('PASS reduced motion');
          await ctx.close();
          await browser.close();
          console.log('RESTORED_HOME_FAILURES='+failures);
          if(failures)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-home-with-pricing-testimonials-query
          path: /tmp/eh-home-restored/
          if-no-files-found: ignore

name: Temporary cross-page FAQ navigation verification
on:
  push:
    branches: [ui/homepage-orange-motion-refine-20261102]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_FIREBASE_API_KEY: AIzaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: eventhive-faq-test
      VITE_FIREBASE_STORAGE_BUCKET: eventhive-faq-test.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef1234
      VITE_FIREBASE_DATABASE_URL: https://eventhive-test-default-rtdb.firebaseio.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Unit tests
        if: always()
        run: npm test
      - name: Install browser checker
        if: always()
        run: npm install --no-save --package-lock=false playwright
      - name: Click FAQ from all public pages
        if: always()
        run: |
          set -e
          npm run dev -- --host 127.0.0.1 > /tmp/eh-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/Login >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ channel: "chrome", headless: true, args: ["--no-sandbox"] });
          const widths = [375, 768, 1440];
          const routes = ["/", "/Events", "/Login", "/OrganizerRegistration", "/EventRegistration", "/events/demo/demo-event"];
          const fake = {
            id: "demo-event", EventName: "Example Festival",
            eventDate: "2027-05-08", eventType: "Music", location: "Delhi",
            BannerTagLine: "Community Celebration", ShortDesc: "A creative community event",
            speakers: [], PrimaryColor: "#F26B2A", SecondaryColor: "#E88A54"
          };
          let fails = 0;
          for (const width of widths) {
            const context = await browser.newContext({ viewport: { width, height: 850 }, reducedMotion: "reduce" });
            const page = await context.newPage();
            await page.route("**/Events/*.json", route => route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(fake) }));
            await page.route("**/Events.json", route => route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ "demo-event": fake }) }));
            await page.route("**/Organizer/*.json", route => route.fulfill({ status: 200, contentType: "application/json", body: "null" }));
            for (const route of routes) {
              try {
                await page.goto("http://127.0.0.1:5173" + route, { waitUntil: "domcontentloaded" });
                await page.waitForTimeout(800);
                const microsite = route.startsWith("/events/");
                if (width < 1024) {
                  const openButton = microsite ? page.getByRole("button", { name: "Open menu" }) : page.getByRole("button", { name: "Open navigation menu" });
                  await openButton.click();
                }
                const faq = microsite ? page.getByRole("button", { name: "FAQ", exact: true }) : page.getByRole("link", { name: "FAQ", exact: true });
                await faq.click();
                await page.waitForURL("**/#faq", { timeout: 10000 });
                await page.waitForSelector("#faq", { timeout: 10000 });
                await page.waitForTimeout(800);
                const metrics = await page.evaluate(() => ({
                  hash: location.hash,
                  path: location.pathname,
                  faqTop: document.getElementById("faq")?.getBoundingClientRect().top,
                  viewportHeight: innerHeight,
                  docWidth: document.documentElement.scrollWidth,
                  viewportWidth: innerWidth
                }));
                const aligned = metrics.faqTop !== undefined && metrics.faqTop >= -4 && metrics.faqTop < 360;
                if (!aligned || metrics.path !== "/" || metrics.hash !== "#faq" || metrics.docWidth > metrics.viewportWidth + 2) {
                  fails++;
                  console.error("FAIL FAQ width=" + width + " from=" + route + " " + JSON.stringify(metrics));
                } else {
                  console.log("PASS FAQ width=" + width + " from=" + route + " top=" + metrics.faqTop.toFixed(1));
                }
              } catch (err) {
                fails++;
                console.error("FAIL FAQ width=" + width + " from=" + route + " " + String(err));
              }
            }
            await context.close();
          }
          await browser.close();
          console.log("FAQ_CHECK_FAILURES=" + fails);
          if (fails) process.exitCode = 1;
          NODE

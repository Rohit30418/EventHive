name: Render EventHive PNG assets

on:
  push:
    branches:
      - design/eventhive-violet-ui-2026
    paths:
      - 'public/eventhive-assets/**.svg'
      - '.github/workflows/render-eventhive-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SVG rasterizer
        run: python -m pip install --quiet cairosvg
      - name: Convert every named SVG into matching PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          root = Path("public/eventhive-assets")
          images = list(root.glob("*.svg"))
          if len(images) < 14:
              raise SystemExit("Expected at least 14 branded EventHive source illustrations")
          for asset in images:
              png = asset.with_suffix(".png")
              cairosvg.svg2png(url=str(asset), write_to=str(png))
              print(f"Created {png}")
          PY
      - name: Package generated PNG assets
        uses: actions/upload-artifact@v4
        with:
          name: EventHive_Named_PNG_Assets
          path: public/eventhive-assets/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Commit image PNGs to the existing design branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/eventhive-assets/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: render named EventHive artwork PNGs from approved SVG sources"
            git push origin HEAD:design/eventhive-violet-ui-2026
          fi

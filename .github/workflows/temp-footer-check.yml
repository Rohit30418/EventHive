name: Temporary footer alignment verification
on:
  push:
    branches: [ui/homepage-orange-motion-refine-20261102]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_FIREBASE_API_KEY: AIzaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: eventhive-footer-test
      VITE_FIREBASE_STORAGE_BUCKET: eventhive-footer-test.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef1234
      VITE_FIREBASE_DATABASE_URL: https://eventhive-test-default-rtdb.firebaseio.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install browser checker
        run: npm install --no-save --package-lock=false playwright
      - name: Verify microsite footer alignment at three widths
        run: |
          set -e
          mkdir -p /tmp/eh-footer-shots
          npm run dev -- --host 127.0.0.1 > /tmp/eh-footer-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/events/demo/demo-event >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ channel:'chrome', headless:true, args:['--no-sandbox']});
          const event = {
            id:'demo-event', EventName:'Advanced React & JS Patterns',eventDate:'2026-01-01',eventType:'Webinar',
            location:'Online / India',PrimaryColor:'#3FA4BC',SecondaryColor:'#284357',
            speakers:[], ShortDesc:'Experience the extraordinary. We bring people together to inspire, connect and grow through world-class events.'
          };
          let failures = 0;
          for (const width of [375,768,1440]) {
            const ctx=await browser.newContext({ viewport: {width,height:850}, reducedMotion:'reduce' });
            const page=await ctx.newPage();
            await page.route('**/Events/*.json', route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(event)}));
            await page.goto('http://127.0.0.1:5173/events/demo/demo-event',{waitUntil:'domcontentloaded'});
            await page.locator('.eh-ms-footer-grid').waitFor();
            const m=await page.evaluate(()=>{
              const rect=e=>e?.getBoundingClientRect();
              const cols=[...document.querySelectorAll('.eh-ms-footer-grid > .eh-ms-footer-column')].map(el=>rect(el));
              const mid=[...document.querySelectorAll('.eh-ms-footer-links > div')].map(el=>rect(el));
              const areas=[...document.querySelectorAll('.eh-ms-footer-column h4')].map(el=>({text:el.textContent,top:rect(el).top,left:rect(el).left}));
              return {
                width:innerWidth,overflow:document.documentElement.scrollWidth-innerWidth,
                columns:getComputedStyle(document.querySelector('.eh-ms-footer-grid')).gridTemplateColumns,
                middle:getComputedStyle(document.querySelector('.eh-ms-footer-links')).gridTemplateColumns,
                tops:cols.map(x=>x.top),lefts:cols.map(x=>x.left),
                middleTop:mid.map(x=>x.top),middleLeft:mid.map(x=>x.left),
                areas
              };
            });
            const sameTop=m.tops.length===3 && Math.max(...m.tops)-Math.min(...m.tops)<2;
            const middleSameTop=m.middleTop.length===2 && Math.max(...m.middleTop)-Math.min(...m.middleTop)<2;
            const desktopSeparate=width!==1440 || (m.lefts[0]<m.lefts[1] && m.lefts[1]<m.lefts[2] && m.middleLeft[0]<m.middleLeft[1]);
            const passed=m.overflow<=2 && (width!==1440 || (sameTop && middleSameTop && desktopSeparate));
            console.log((passed?'PASS':'FAIL')+' FOOTER width='+width+' '+JSON.stringify(m));
            if(!passed) failures++;
            await page.locator('footer').screenshot({path:'/tmp/eh-footer-shots/footer-'+width+'.png'});
            await ctx.close();
          }
          await browser.close();
          console.log('FOOTER_FAILURES='+failures);
          if(failures)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footer-alignment-screenshots
          path: /tmp/eh-footer-shots
          if-no-files-found: ignore

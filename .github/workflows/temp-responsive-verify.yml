name: Temporary EventHive responsive verification
on:
  push:
    branches:
      - ui/homepage-orange-motion-refine-20261102
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: AIzaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: eventhive-responsive-test
      VITE_FIREBASE_STORAGE_BUCKET: eventhive-responsive-test.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef1234
      VITE_FIREBASE_DATABASE_URL: https://eventhive-test-default-rtdb.firebaseio.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Unit tests
        if: always()
        run: npm test
      - name: Install temporary browser checker
        if: always()
        run: npm install --no-save --package-lock=false playwright
      - name: Public page viewport smoke tests
        if: always()
        run: |
          set -e
          mkdir -p /tmp/eh-shots
          npm run dev -- --host 127.0.0.1 > /tmp/eh-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/Login >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import { mkdirSync } from "node:fs";

          const browser = await chromium.launch({ channel: "chrome", headless: true, args: ["--no-sandbox"] });
          mkdirSync("/tmp/eh-shots", { recursive: true });
          const screens = [375, 768, 1024, 1440];
          const pages = ["/", "/Events", "/Login", "/OrganizerRegistration", "/EventRegistration", "/events/sample/demo-event", "/unauthorized", "/not-a-real-page"];
          const fake = {
            id: "demo-event", EventName: "EventHive Responsive Test Event",
            eventDate: "2027-04-12", eventType: "Conference",
            location: "Delhi, India",
            ShortDesc: "Test event preview for responsive navigation.",
            BannerTagLine: "Made for everyone.",
            speakers: [],
            PrimaryColor: "#F26B2A", SecondaryColor: "#E88A54"
          };
          let failures = 0;

          for (const width of screens) {
            const context = await browser.newContext({ viewport: { width, height: 850 }, reducedMotion: "reduce" });
            const page = await context.newPage();
            await page.route("**/Events/*.json", async route => route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(fake) }));
            await page.route("**/Events.json", async route => route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ "demo-event": fake }) }));
            await page.route("**/Organizer/*.json", async route => route.fulfill({ status: 200, contentType: "application/json", body: "null" }));
            for (const path of pages) {
              try {
                await page.goto("http://127.0.0.1:5173" + path, { waitUntil: "domcontentloaded", timeout: 30000 });
                await page.waitForTimeout(1500);
                const state = await page.evaluate(() => ({
                  viewport: window.innerWidth,
                  doc: document.documentElement.scrollWidth,
                  body: document.body.scrollWidth,
                  root: document.querySelector("#root")?.scrollWidth ?? 0,
                  content: document.querySelector("#root")?.textContent?.trim().length || 0,
                  error: document.querySelector("vite-error-overlay") ? true : false
                }));
                const authPage = ["/Login", "/OrganizerRegistration", "/EventRegistration"].includes(path);
                let formOnly = "n/a";
                if (authPage) {
                  const aside = page.locator("section aside").first();
                  const form = page.locator("form").first();
                  const formVisible = await form.isVisible().catch(() => false);
                  const asideVisible = await aside.isVisible().catch(() => false);
                  formOnly = "form=" + formVisible + ",info=" + asideVisible;
                  if (width < 1024 && (!formVisible || asideVisible)) {
                    failures++;
                    console.error("FAIL form-only: width=" + width + " path=" + path + " " + formOnly);
                  }
                }
                const overflow = Math.max(state.doc, state.body, state.root) - state.viewport;
                if (overflow > 2 || state.error || state.content < 30) {
                  failures++;
                  console.error("FAIL layout: " + width + " " + path + " overflow=" + overflow + " error=" + state.error + " content=" + state.content);
                } else {
                  console.log("PASS viewport=" + width + " path=" + path + " overflow=" + overflow + " " + formOnly);
                }
                const slug = path === "/" ? "home" : path.replaceAll("/", "_");
                if (["/", "/Events", "/Login", "/OrganizerRegistration", "/EventRegistration", "/events/sample/demo-event"].includes(path)) {
                  await page.screenshot({ path: "/tmp/eh-shots/" + width + slug + ".png", fullPage: false });
                }
              } catch (error) {
                failures++;
                console.error("FAIL navigation: " + width + " " + path + " " + String(error));
              }
            }
            await context.close();
          }
          await browser.close();
          console.log("RESPONSIVE_CHECK_FAILURES=" + failures);
          if (failures > 0) process.exitCode = 1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: /tmp/eh-shots/
          if-no-files-found: ignore

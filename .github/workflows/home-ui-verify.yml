name: EventHive home UI verification
on:
  push:
    branches:
      - ui/homepage-orange-motion-refine-20261102
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install requested Lenis dependency
        run: |
          npm install lenis --save --ignore-scripts
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "feat(home): add Lenis dependency and lockfile"
            git push origin HEAD:ui/homepage-orange-motion-refine-20261102
          fi
      - run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Tests
        if: always()
        run: npm test

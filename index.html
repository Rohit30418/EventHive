<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventHive | Create Events. Exciting Events.</title>

    <!-- ==========================================
         Favicons & App Icons
         ========================================== -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- ==========================================
         Primary Meta Tags (SEO & Browser)
         ========================================== -->
    <meta name="title" content="EventHive | Create Events. Exciting Events." />
    <meta name="description" content="A simplified platform to create, manage, and promote your events in minutes. Join organizers growing their community today with EventHive." />
    <meta name="keywords" content="event management, ticketing platform, host events, event coordination, EventHive" />
    <meta name="author" content="Rohit Pant" />
    <meta name="robots" content="index, follow" />
    
    <!-- Theme Color matches the dark navy background of your hero section for mobile browser tabs -->
    <meta name="theme-color" content="#0F172A" />

    <!-- ==========================================
         Open Graph / Facebook / LinkedIn
         ========================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.your-eventhive-domain.com/" />
    <meta property="og:title" content="EventHive | Create Events. Exciting Events." />
    <meta property="og:description" content="A simplified platform to create, manage, and promote your events in minutes. Join organizers growing their community today." />
    <!-- Image should be 1200x630px for best results across platforms -->
    <meta property="og:image" content="https://www.your-eventhive-domain.com/og-image.jpg" />

    <!-- ==========================================
         Twitter / X
         ========================================== -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.your-eventhive-domain.com/" />
    <meta property="twitter:title" content="EventHive | Create Events. Exciting Events." />
    <meta property="twitter:description" content="A simplified platform to create, manage, and promote your events in minutes. Join organizers growing their community today." />
    <meta property="twitter:image" content="https://www.your-eventhive-domain.com/og-image.jpg" />

    <!-- ==========================================
         Fonts & Icons 
         ========================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link 
      rel="preload" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/webfonts/fa-solid-900.woff2" 
      as="font" 
      type="font/woff2" 
      crossorigin
    >

    />

      body {

        margin: 0;

        overflow-x: hidden; 
      }
